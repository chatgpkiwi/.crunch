# Coding-agent configuration for task execution.
#
# crunch dispatches its `default` agent to the provider named below. Supported
# providers are `aider` and `codex`.
coding_agents:
  default:
    provider: aider
    model: "openai/lemonade-qwen"
    openai-api-base: "http://127.0.0.1:4000"
    openai-api-key: "sk-local"

#    provider: codex
#    model: "5.6 Luna"
#    effort: low
