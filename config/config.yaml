# Coding-agent configuration for task execution. Exactly one uncommented
# `coding_agent` block is allowed. Supported providers are `aider` and `codex`.
# Qwen is reserved for a future provider implementation.
coding_agent:
  provider: aider
  model: "openai/lemonade-qwen"
  openai-api-base: "http://127.0.0.1:4000"
  openai-api-key: "sk-local"

#### CODEX EXAMPLE
# coding_agent:
#   provider: codex
#   model: "5.6 Luna"
#   effort: low

#### QWEN CODER (not implemented yet)
# coding_agent:
#   provider: qwen
